
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #263445;
        }

        header {
            background: #17365d;
            color: white;
            padding: 22px 30px;
        }

        header h2 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(190px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0000000d;
        }

        .card h3 {
            color: #68778a;
            font-size: 15px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #17365d;
        }

        .welcome {
            margin-bottom: 25px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #68778a;
        }
    </style>
</head>

<body>

<header>
    <h2>HR Management System</h2>
    <p>Human Resources | Attendance | Payroll</p>
</header>

<div class="container">

    <div class="welcome">
        <h1>Dashboard</h1>
        <p>Welcome to your HR Management System.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Employees</h3>
            <div class="number">150</div>
        </div>

        <div class="card">
            <h3>Present Today</h3>
            <div class="number">125</div>
        </div>

        <div class="card">
            <h3>Absent Today</h3>
            <div class="number">15</div>
        </div>

        <div class="card">
            <h3>On Leave</h3>
            <div class="number">10</div>
        </div>

    </div>

</div>

<footer>
    HR Management System | Version 1.0
</footer>
